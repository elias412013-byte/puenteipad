name: PuenteiPad
options:
  bundleIdPrefix: com.puenteipad
targets:
  PuenteiPad:
    type: application
    platform: iOS
    deploymentTarget: "12.0"
    sources:
      - PuenteiPad
    info:
      path: PuenteiPad/Info.plist
      properties:
        CFBundleDisplayName: PuenteiPad
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [armv7]
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationLandscapeLeft]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationLandscapeLeft]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.puenteipad.app
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
